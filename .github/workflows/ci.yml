name: CI

# Chaque PR passe par les tests et le build avant d'être fusionnée.
# Sans ce job, `pnpm test` ne tournait nulle part : le build du Dockerfile
# ne lance que `pnpm build`, et seulement au déploiement, après la release.
on:
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Même installation que le Dockerfile : corepack fournit pnpm.
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Type check and build
        run: pnpm build

      # Le build servi par `vite preview`, dans un Chromium logiciel
      # (SwiftShader) : console sans avertissement hors liste blanche, et
      # plafond d'appels de dessin à l'âge 10 (environ 25 s et 30 s en local).
      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Console check
        run: pnpm check:console

      - name: Draw-call budget
        run: pnpm perf:budget
