server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable; the shell must never be cached, or a
    # deploy leaves phones on the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Live progress page, bind-mounted from the host so it can be updated
    # between rounds without rebuilding the image.
    location /progress {
        alias /usr/share/nginx/html/progress;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /progress/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
