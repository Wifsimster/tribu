<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#9fd4e8" />
    <meta
      name="description"
      content="Tribu — un jeu idle en 3D. Un colon, un feu, et 300 000 ans à traverser."
    />
    <title>Tribu — du silex à l’aqueduc</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16.6 1.2c2.6 6.4-2 8.6-2 12.6 0 2 1.3 3.3 3 3.3 1.9 0 3.2-1.6 3-3.9 3 2.7 4.4 5.7 4.4 8.7 0 5.6-4.3 9.6-9 9.6S7 27.5 7 21.9c0-7.9 7-10.5 9.6-20.7z' fill='%23e0873a'/%3E%3Cpath d='M16 30.8c-2.9 0-5-2.3-5-5.4 0-3.8 3.4-5 4.4-9.6 2 2.5 5.6 4.6 5.6 8.9 0 3.6-2 6.1-5 6.1z' fill='%23f5c059'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="ui">
      <div class="top">
        <div class="age">
          <div class="age-name" id="age-name">Paléolithique</div>
          <div class="age-period" id="age-period">−300 000 à −10 000</div>
          <div class="age-track">
            <div class="age-bar"><i id="age-fill" style="width: 0%"></i></div>
            <span class="age-step" id="age-step">0/4</span>
          </div>
        </div>
        <div class="resources" id="resources"></div>
      </div>

      <div class="bottom">
        <div class="focus-row" id="focus-row"></div>
        <div class="actions">
          <button class="btn" id="btn-expedition" type="button">
            <span class="fill" id="expedition-fill"></span>
            <span class="label" id="expedition-label">Expédition</span>
          </button>
          <button class="btn primary" id="btn-research" type="button">
            <span class="label">Savoir</span>
            <span class="badge" id="research-badge" hidden>0</span>
          </button>
        </div>
      </div>
    </div>

    <div class="scrim" id="scrim"></div>

    <div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">Découvertes</h2>
        <button class="icon-btn" id="sheet-close" type="button" aria-label="Fermer">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false">
            <path
              d="M6 6l12 12M18 6L6 18"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>

    <div class="fact" id="fact" role="dialog" aria-modal="true" aria-labelledby="fact-title">
      <div class="fact-head">
        <svg class="glyph" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
          <path
            d="M12 2.2c.9 5 3.7 7.8 8.8 8.7-5.1.9-7.9 3.7-8.8 8.7-.9-5-3.7-7.8-8.8-8.7 5.1-.9 7.9-3.7 8.8-8.7z"
            fill="currentColor"
          />
        </svg>
        <span class="kicker" id="fact-kicker">Découverte</span>
      </div>
      <h3 id="fact-title">Maîtrise du feu</h3>
      <div class="rule"></div>
      <p id="fact-text"></p>
      <button class="btn primary wide" id="fact-close" type="button">
        <span class="label">Continuer</span>
      </button>
    </div>

    <div class="banner" id="banner">
      <div class="small" id="banner-small">Nouvel âge</div>
      <div class="big" id="banner-big">Néolithique</div>
    </div>

    <div class="toasts" id="toasts"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
