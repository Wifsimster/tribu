<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#9fd4e8" />
    <meta
      name="description"
      content="Tribu — un jeu idle en 3D. Un colon, un feu, et 300 000 ans à traverser."
    />
    <title>Tribu — du silex à l’aqueduc</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🔥%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="ui">
      <div class="top">
        <div class="age-card">
          <div class="age-name" id="age-name">Paléolithique</div>
          <div class="age-period" id="age-period">−300 000 à −10 000</div>
          <div class="age-bar"><i id="age-fill" style="width: 0%"></i></div>
        </div>
        <div class="resources" id="resources"></div>
      </div>

      <div class="bottom">
        <div class="focus-row" id="focus-row"></div>
        <div class="actions">
          <button class="btn" id="btn-expedition" type="button">
            <span class="fill" id="expedition-fill"></span>
            <span class="label" id="expedition-label">Expédition</span>
          </button>
          <button class="btn primary" id="btn-research" type="button">
            <span class="label">Savoir</span>
            <span class="badge" id="research-badge" hidden>0</span>
          </button>
        </div>
      </div>
    </div>

    <div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">Découvertes</h2>
        <button class="icon-btn" id="sheet-close" type="button" aria-label="Fermer">✕</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>

    <div class="fact" id="fact" role="dialog" aria-modal="true" aria-labelledby="fact-title">
      <div class="kicker" id="fact-kicker">Découverte</div>
      <h3 id="fact-title">Maîtrise du feu</h3>
      <div class="rule"></div>
      <p id="fact-text"></p>
      <button class="btn primary" id="fact-close" type="button">
        <span class="label">Continuer</span>
      </button>
    </div>

    <div class="banner" id="banner">
      <div class="small" id="banner-small">Nouvel âge</div>
      <div class="big" id="banner-big">Néolithique</div>
    </div>

    <div class="toasts" id="toasts"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
